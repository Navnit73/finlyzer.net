name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================
  # 1. BUILD + TEST + PUSH TO GHCR
  # ============================================================

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Test Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 2. DEPLOY TO VPS
  # ============================================================

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          envs: GHCR_USERNAME,GHCR_TOKEN,GITHUB_SHA

          script: |

            set -u

            DEPLOY_DIR="/var/www/finlyzers"

            IMAGE_BASE="ghcr.io/${{ github.repository }}"
            NEW_IMAGE="${IMAGE_BASE}:sha-${GITHUB_SHA:0:7}"

            cd "$DEPLOY_DIR"

            echo "======================================"
            echo "Finlyzers Deployment"
            echo "======================================"

            echo "New image:"
            echo "$NEW_IMAGE"


            # ==================================================
            # GHCR LOGIN
            # ==================================================

            echo "Logging into GHCR..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin


            # ==================================================
            # SAVE CURRENT IMAGE
            # ==================================================

            PREV_IMAGE=""

            if docker inspect finlyzers-app >/dev/null 2>&1; then

              PREV_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                finlyzers-app)

            fi

            echo "Previous image:"
            echo "${PREV_IMAGE:-None}"


            # ==================================================
            # PULL NEW IMAGE
            # ==================================================

            echo "Pulling new image..."

            if ! docker pull "$NEW_IMAGE"; then

              echo "ERROR: Failed to pull new image."

              exit 1

            fi


            # ==================================================
            # CREATE COMPOSE FILE
            # ==================================================

            cat > docker-compose.yml <<EOF

            services:

              web:

                image: ${NEW_IMAGE}

                container_name: finlyzers-app

                restart: unless-stopped

                env_file:
                  - .env

                environment:
                  NODE_ENV: production
                  PORT: 3000

                ports:
                  - "127.0.0.1:3000:3000"

                healthcheck:

                  test:
                    [
                      "CMD-SHELL",
                      "wget -qO- http://127.0.0.1:3000/api/health || exit 1"
                    ]

                  interval: 5s
                  timeout: 3s
                  retries: 6
                  start_period: 15s

            EOF


            # ==================================================
            # START NEW VERSION
            # ==================================================

            echo "Starting new version..."

            docker compose up -d --remove-orphans


            # ==================================================
            # HEALTH CHECK
            # ==================================================

            HEALTHY=false

            echo "Waiting for application..."

            for i in $(seq 1 20); do

              sleep 3

              HTTP_CODE=$(curl \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                http://127.0.0.1:3000/api/health || true)

              CONTAINER_STATUS=$(docker inspect \
                --format='{{json .State.Health.Status}}' \
                finlyzers-app 2>/dev/null || echo '"unknown"')

              echo "Check $i/20"
              echo "HTTP: $HTTP_CODE"
              echo "Container: $CONTAINER_STATUS"

              if [ "$HTTP_CODE" = "200" ]; then

                HEALTHY=true
                break

              fi

            done


            # ==================================================
            # SUCCESS
            # ==================================================

            if [ "$HEALTHY" = true ]; then

              echo "======================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "======================================"

              docker compose ps

              exit 0

            fi


            # ==================================================
            # FAILURE
            # ==================================================

            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "======================================"

            docker logs --tail 100 finlyzers-app || true


            # ==================================================
            # ROLLBACK
            # ==================================================

            if [ -n "$PREV_IMAGE" ]; then

              echo "Rolling back to:"
              echo "$PREV_IMAGE"

              docker pull "$PREV_IMAGE" || true

              sed -i \
                "s|image: .*|image: ${PREV_IMAGE}|" \
                docker-compose.yml

              docker compose up -d --remove-orphans

              sleep 10

              if curl -fsS \
                http://127.0.0.1:3000/api/health \
                >/dev/null; then

                echo "ROLLBACK SUCCESSFUL"

              else

                echo "ROLLBACK HEALTH CHECK FAILED"

                docker logs --tail 100 finlyzers-app || true

              fi

            else

              echo "No previous image available."

            fi


            exit 1