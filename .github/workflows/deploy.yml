name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: finlyzer-frontend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OCR_API_BASE_URL: ${{ secrets.OCR_API_BASE_URL }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/.next

          cp -a .next/standalone/. deploy/

          cp -a .next/static deploy/.next/

          if [ -d public ]; then
            cp -a public deploy/
          fi

      - name: Create deployment archive
        run: |
          tar -czf frontend.tar.gz -C deploy .

      - name: Upload to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/tmp/finlyzer-frontend-${{ github.sha }}.tar.gz"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA
          script: |
            set -e

            RELEASE="/var/www/finlyzer/releases/${SHA}/frontend"
            ARCHIVE="/tmp/finlyzer-frontend-${SHA}.tar.gz"

            mkdir -p "$RELEASE"

            tar -xzf "$ARCHIVE" -C "$RELEASE"

            ln -sfn \
              /var/www/finlyzer/shared/frontend.env \
              "$RELEASE/.env.production"

            ln -sfn \
              "$RELEASE" \
              /var/www/finlyzer/current-frontend

            cd /var/www/finlyzer

            pm2 reload finlyzer-frontend --update-env

            pm2 save

            rm -f "$ARCHIVE"

            echo "Frontend deployed successfully: $SHA"

            pm2 status
