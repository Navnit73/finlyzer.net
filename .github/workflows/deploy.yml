name: Deploy Finlyzer Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finlyzer-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install password-based SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PASSWORD"

          export SSHPASS="$DEPLOY_PASSWORD"

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            "deploy@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-finlyzer-frontend $COMMIT_SHA"

          unset SSHPASS
