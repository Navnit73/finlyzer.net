name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: finlyzer-frontend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OCR_API_BASE_URL: ${{ secrets.OCR_API_BASE_URL }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run build

      - name: Prepare deployment package
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy/.next

          # Copy Next.js standalone build
          cp -a .next/standalone/. deploy/

          # Copy static assets
          cp -a .next/static deploy/.next/

          # Copy public directory when available
          if [ -d public ]; then
            cp -a public deploy/
          fi

      - name: Create deployment archive
        run: |
          set -e

          tar -czf frontend.tar.gz -C deploy .

          echo "Deployment archive created:"
          ls -lh frontend.tar.gz

      - name: Upload to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/tmp/finlyzer-frontend-${{ github.sha }}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA
          script: |
            set -e

            APP_ROOT="/var/www/finlyzer"
            RELEASE="$APP_ROOT/releases/$SHA/frontend"
            ARCHIVE="/tmp/finlyzer-frontend-$SHA/frontend.tar.gz"

            echo "=========================================="
            echo "Deploying Finlyzer Frontend"
            echo "SHA: $SHA"
            echo "=========================================="

            # Verify uploaded archive exists
            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive not found:"
              echo "$ARCHIVE"

              echo "Available files:"
              ls -lah "/tmp/finlyzer-frontend-$SHA" || true

              exit 1
            fi

            # Create release directory
            mkdir -p "$RELEASE"

            # Extract deployment package
            echo "Extracting deployment package..."
            tar -xzf "$ARCHIVE" -C "$RELEASE"

            # Verify standalone server exists
            if [ ! -f "$RELEASE/server.js" ]; then
              echo "ERROR: server.js not found in release"
              find "$RELEASE" -maxdepth 2 -type f | head -50
              exit 1
            fi

            # Connect production environment
            ln -sfn \
              "$APP_ROOT/shared/frontend.env" \
              "$RELEASE/.env.production"

            # Update current release symlink
            ln -sfn \
              "$RELEASE" \
              "$APP_ROOT/current-frontend"

            # Reload PM2 application
            echo "Reloading PM2..."
            pm2 reload finlyzer-frontend --update-env

            # Save PM2 process list
            pm2 save

            # Cleanup uploaded archive
            rm -rf "/tmp/finlyzer-frontend-$SHA"

            # Remove old releases, keep latest 5
            cd "$APP_ROOT/releases"

            ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "=========================================="
            echo "Frontend deployed successfully"
            echo "Release: $RELEASE"
            echo "=========================================="

            pm2 status