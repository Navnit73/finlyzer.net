name: Build & Deploy to VPS (No Docker / PM2 Standalone)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. BUILD & TEST ON GITHUB ACTIONS RUNNER
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Build Next.js standalone
        # If build fails here, the workflow aborts immediately.
        # Zero files are sent to your VPS.
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Package standalone release artifact
        run: |
          mkdir -p release_package
          cp -r .next/standalone/* release_package/
          mkdir -p release_package/.next
          cp -r .next/static release_package/.next/static
          if [ -d public ]; then
            cp -r public release_package/public
          fi
          cd release_package
          tar -czf ../release.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-release
          path: release.tar.gz
          retention-days: 1

  # ============================================================
  # 2. DEPLOY PRE-BUILT STANDALONE TO VPS WITH AUTO-ROLLBACK
  # ============================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: standalone-release

      - name: Copy release archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'release.tar.gz'
          target: '/tmp'

      - name: Deploy release & verify health on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_SHA
          script: |
            set -u

            APP_DIR="/var/www/finlyzers"
            RELEASES_DIR="$APP_DIR/releases"
            RELEASE_TAG="release-${GITHUB_SHA:0:7}"
            TARGET_RELEASE="$RELEASES_DIR/$RELEASE_TAG"

            echo "=========================================="
            echo "🚀 Deploying Finlyzers: $RELEASE_TAG"
            echo "=========================================="

            # 1. Ensure directory structure exists
            mkdir -p "$RELEASES_DIR"
            mkdir -p "$TARGET_RELEASE"

            # 2. Capture previous active release (for automatic rollback)
            PREV_RELEASE=""
            if [ -L "$APP_DIR/current" ]; then
              PREV_RELEASE=$(readlink -f "$APP_DIR/current" || echo "")
            fi
            echo "Previous active release: ${PREV_RELEASE:-None (First deployment)}"

            # 3. Extract pre-built release package
            echo "Extracting release bundle..."
            tar -xzf /tmp/release.tar.gz -C "$TARGET_RELEASE"
            rm -f /tmp/release.tar.gz

            # 4. Copy/link production .env file
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$TARGET_RELEASE/.env"
            else
              echo "⚠️ Warning: $APP_DIR/.env not found. Creating placeholder..."
              touch "$APP_DIR/.env"
              cp "$APP_DIR/.env" "$TARGET_RELEASE/.env"
            fi

            # 5. Switch symlink to new release
            echo "Switching active release symlink..."
            ln -sfn "$TARGET_RELEASE" "$APP_DIR/current"

            # 6. Start / Restart application with PM2
            cd "$APP_DIR/current"
            if pm2 describe finlyzers > /dev/null 2>&1; then
              echo "Reloading PM2 instance..."
              pm2 reload finlyzers --update-env
            else
              echo "Starting new PM2 instance..."
              PORT=3000 pm2 start server.js --name finlyzers --update-env
            fi
            pm2 save

            # 7. Automated Health Check Verification
            echo "Running automated health checks on http://127.0.0.1:3000/api/health..."
            HEALTHY=false

            for i in $(seq 1 15); do
              sleep 2
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
              echo "Health check $i/15: HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                HEALTHY=true
                break
              fi
            done

            # 8. Handle Success or Automatic Rollback
            if [ "$HEALTHY" = true ]; then
              echo "=========================================="
              echo "✅ DEPLOYMENT SUCCESSFUL!"
              echo "=========================================="
              pm2 status finlyzers

              # Keep only the last 5 releases to prevent disk fill
              cd "$RELEASES_DIR"
              ls -dt release-* | tail -n +6 | xargs rm -rf 2>/dev/null || true
              exit 0
            else
              echo "=========================================="
              echo "❌ HEALTH CHECK FAILED! Initiating Rollback..."
              echo "=========================================="
              pm2 logs finlyzers --lines 30 --nostream || true

              if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
                echo "Rolling back symlink to: $PREV_RELEASE"
                ln -sfn "$PREV_RELEASE" "$APP_DIR/current"
                cd "$APP_DIR/current"
                pm2 reload finlyzers --update-env
                echo "⚠️ Successfully rolled back to previous release."
              else
                echo "⚠️ No previous release available to rollback."
              fi

              exit 1
            fi